name: Software checks
on: [push, pull_request]
jobs:
  javascript:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run check
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s vision -p 'test_*.py'
      - run: python -m compileall vision hardware/read_esp32.py
